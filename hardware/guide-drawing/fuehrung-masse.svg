hor="start">Rahmen innen 83 × 21 umfasst das Gehäuse (82,5 × 20,4), Boden bei 6,5 mm = Anschlag.</text><text x="90.0" y="1103.4" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Zwei Stifte (Abstand 74) drücken die Klappe der Original-Cartridge auf, der Slot schiebt den Schieber hoch.</text><text x="90.0" y="1124.1" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Verpolschutz: Slot 2,2 mm außermittig (Platinenlage). Verkehrt herum trifft der Slot nicht den Schlitz.</text><text x="90.0" y="1144.8" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Sockel 61 × 17 trägt den Rahmen, verschraubt an den M2,5-Löchern. Rahmen ragt bei Uno/Mega/Nano über die Platine.</text><text x="90.0" y="1165.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Offen (rot):</text><text x="90.0" y="1186.2" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Stifthöhe 28 über Platine angenommen (3 mm über dem Slot); Angabe «12-14 ab Boden» gilt für den Konsolenstecker (8-10 hoch).</text><text x="90.0" y="1206.9" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Schachtwerte sind ca.-Werte, nicht nachgemessen. Bauteile unter dem Rahmen (bis 6,5 hoch) nicht geprüft.</text></svg>