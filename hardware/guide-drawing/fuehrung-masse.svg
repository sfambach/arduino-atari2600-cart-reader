ot-Oberkante (25).</text><text x="576.0" y="1160.1" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Die Spitze schiebt den Schieber hoch, die zwei</text><text x="576.0" y="1180.8" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Laschen (6,75 hoch) öffnen die Klappe.</text><text x="576.0" y="1201.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Kein Außenrahmen: nur der Sockel 61 × 17</text><text x="576.0" y="1222.2" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">steht auf der Platine (M2,5-Löcher).</text><text x="576.0" y="1242.9" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Offen (rot):</text><text x="576.0" y="1263.6" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Versatz 2,1 aus vcsslot, nicht an Slot B gemessen.</text><text x="576.0" y="1284.3" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Seite B: neben dem Slot nur 0,75 Platz,</text><text x="576.0" y="1305.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">dort Wand ausgespart.</text><text x="576.0" y="1325.7" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Laschen bei Nachbau-Gehäusen mit Halter prüfen.</text></svg>