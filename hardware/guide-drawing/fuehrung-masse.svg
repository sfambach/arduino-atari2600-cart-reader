atte und bei Uno/Mega über die</text><text x="414.0" y="795.6" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Platinenkante (ab 6,5 mm Höhe, dort ist nichts).</text><text x="414.0" y="816.3" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Offen (rot):</text><text x="414.0" y="837.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Welche Seite (A = 9 mm) ist die Etikettseite?</text><text x="414.0" y="857.7" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Platinendicke 0,5 (Summe passt) oder 1,6 (Standard)?</text><text x="414.0" y="878.4" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Für Slot A (16,1 hoch, Laschen) eigene, niedrigere Variante.</text></svg>