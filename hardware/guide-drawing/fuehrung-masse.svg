nd, Seite B bleibt offen (dort wären nur 0,2 mm Wand).</text><text x="414.0" y="774.9" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Verkehrt herum stößt das Gehäuse an die Wand von Seite A.</text><text x="414.0" y="795.6" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Platinenlage aus ATARI_CARY_REV_2_holder.stl (Stefan, 14.11.2026):</text><text x="414.0" y="816.3" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Halteplatte 76,4 × 15,7, Schlitz 2,5 breit, 5,6 / 10,0 von den Kanten.</text><text x="414.0" y="837.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Offen (rot):</text><text x="414.0" y="857.7" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Welche Seite (A) ist die Etikettseite?</text><text x="414.0" y="878.4" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Sitzt im Gehäuse etwas, das die Führung beim Einschieben blockiert?</text><text x="414.0" y="899.1" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Für Slot A (16,1 hoch, Laschen) eigene, niedrigere Variante.</text></svg>