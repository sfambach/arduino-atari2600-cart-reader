 fill="#222" text-anchor="start">Volle Länge 74,2 nur oben (Führung in der</text><text x="558.0" y="1168.2" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Cartridge), seitlich schräg zum Fuß 51.</text><text x="558.0" y="1188.9" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">2 Schrauben M2,5 von unten durch die Platine.</text><text x="558.0" y="1209.6" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Stifte Ø3 separat, nach dem Druck eingepresst</text><text x="558.0" y="1230.3" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">(Druck kopfüber auf der Deckfläche).</text><text x="558.0" y="1251.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">Offen (rot):</text><text x="558.0" y="1271.7" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Löcher für die Nasen der Cartridge:</text><text x="558.0" y="1292.4" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Lage und Größe fehlen, bitte messen.</text><text x="558.0" y="1313.1" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Versatz 2,1 aus vcsslot, nicht gemessen.</text><text x="558.0" y="1333.8" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Stifte: Stahl-Passstift 3 × 15 oder gedruckt.</text></svg>