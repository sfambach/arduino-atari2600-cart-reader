5 = 3,6,</text><text x="288.0" y="734.4" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">   gemessen 3,1 bis 3,4. Ein Maß ist ca. 0,3 daneben.</text><text x="288.0" y="755.1" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">2. Breite des 35er-Unterteils: gezeichnet 9.</text><text x="288.0" y="775.8" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">3. Schlitz der Cartridge: Maße fehlen.</text><text x="288.0" y="796.5" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Passt: 36,8 + 2 × 7,2 = 51,2 ≈ 51,3 gemessen.</text><text x="288.0" y="817.2" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Loch Ø2,8 in 7,1 breiter Lasche: je 2,15 Rand.</text><text x="288.0" y="837.9" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Laschen bündig mit Unterteil (6 + 6,5 = 12,5).</text><text x="288.0" y="858.6" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#222" text-anchor="start">Höhen ab Unterkante Slot, ohne Rundstift-Adapter.</text><text x="288.0" y="879.3" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#666" text-anchor="start">Lochmitte 2,9 mm von außen. Pins Ø0,5.</text></svg>